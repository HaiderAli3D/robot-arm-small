# Camera 1 is Camo on this laptop. V switches cameras in the preview.
camera = 1
width = 960
height = 720
confidence = 0.4
# Lower values make hand detection/presence/tracking more permissive.
hand_confidence = 0.2
send_hz = 30

# All servos boot at 90 degrees; GPIO9 must physically be open there.
claw_open = 90
claw_closed = 0
pinch_closed_ratio = 0.2
pinch_open_ratio = 1.0
smoothing_tau = 0.12
deadband = 1.0

# No joint travel clipping. Values are nominal pulse coordinates.
# direction = -1 reverses a control; gain scales its movement.
[joints.gpio6]
# Left-hand rotation: four servo degrees per degree of hand movement.
direction = 1
gain = 4

[joints.gpio7]
# Right elbow bend: four servo degrees per degree of arm movement.
direction = 1
gain = 4

[joints.gpio8]
# Right wrist bend: four servo degrees per degree of wrist movement.
direction = 1
gain = 4

[joints.gpio9]
direction = 1
# Ten times the previous claw response, relative to the calibrated pinch.
gain = 100
